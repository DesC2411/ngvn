<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2247" />
    <title>Thử giao diện · May Academy</title>
    <link rel="icon" href="/brand/logo.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0F2247; overscroll-behavior: none; }
      #scene { position: fixed; inset: 0; touch-action: none;
        background: linear-gradient(180deg, #F7C88A 0%, #F3D9A8 38%, #9CC58A 39%, #7FB06E 100%); }
      #scene::after { content: 'Cảnh 3D giả (trang thử giao diện)'; position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        font: 600 14px system-ui, sans-serif; color: rgba(15, 34, 71, .45); }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
      #dev { position: fixed; left: 8px; bottom: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, .92); padding: 6px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
      #dev button { font: inherit; padding: 4px 7px; border-radius: 6px; border: 1px solid #ccd; background: #fff; cursor: pointer; }
      #dev label { display: flex; align-items: center; gap: 3px; }
      #dev.is-min > :not(.dev-toggle) { display: none; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="dev"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/ui/test-main.js"></script>
  </body>
</html>
